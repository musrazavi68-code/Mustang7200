name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mustang720
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: |
          ZIP=$(ls *.zip | head -n1)
          mkdir -p src
          unzip -o "$ZIP" -d src
          ls src/mustang720

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create . --platforms=android --org com.mustang720 --project-name mustang720
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Add INTERNET permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mustang720-apk
          path: src/mustang720/build/app/outputs/flutter-apk/app-release.apk
